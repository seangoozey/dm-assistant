schema_version: 1
purpose: >-
  Sanitized and synthetic acceptance cases for grounded campaign retrieval.
  These records test retrieval policy and are not canonical campaign data.
source_policy:
  allowed_origins:
    - sanitized_starfall_derived
    - synthetic_behavioral
  live_source_accessed: false
  sanitization: >-
    Reuse only facts already present in interaction_cases.yaml. All other names
    and facts are synthetic behavioral examples and must never be imported as canon.
answer_modes:
  - answer
  - insufficient_evidence
  - conflict
  - possible_retcon
  - restricted

cases:
  - id: direct-jace-rebel-role
    category: direct_fact
    fixture_origin: sanitized_starfall_derived
    question: Who leads the rebels?
    requester_visibility: {role: dm}
    authoritative_inputs:
      - {record_id: claim-jace-role, kind: claim, assertion: Jace is a rebel leader, state: established, authority: explicit_lore, visibility: party, source_id: npc-jace, citation: npcs/jace.md#role}
    context_inputs: []
    expected:
      answer_mode: answer
      facts: [Jace is a rebel leader.]
      required_citations: [npcs/jace.md#role]
      forbidden_claims: [Jace is the sole rebel leader., Jace is a noble.]

