[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-assistant-campaign-core"
version = "0.1.0"
description = "Canonical domain and API boundary for DM Assistant"
requires-python = ">=3.12,<3.14"

[project.scripts]
dm-assistant-markdown-import = "dm_assistant_core.importer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dm_assistant_core = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
packages = ["dm_assistant_core"]
